# Local PostgreSQL + Redis. Run the API itself with uv (see README).
# Reads POSTGRES_PASSWORD from .env. Ports bind to localhost only.
# If Homebrew's postgres/redis are running, stop them first or set POSTGRES_PORT / REDIS_PORT.
name: dhan-setu

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dhansetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dhan_setu
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhansetu -d dhan_setu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
