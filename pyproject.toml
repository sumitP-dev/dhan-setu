[project]
name = "dhan-setu-backend"
version = "0.1.0"
description = "Dhan Setu API: card, UPI and BBPS payments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "bcrypt>=5.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3",
    "fastapi>=0.162",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.uv]
# An application, not an installable library.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Deprecations and other warnings fail the run instead of being ignored.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "S",        # security (bandit)
    "SIM",      # simplifications
    "RET",      # return statements
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "PL",       # pylint
    "TC",       # type-checking-only imports
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts, literal status codes and throwaway passwords.
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.ruff.lint.pylint]
# Services take their dependencies as keyword-only constructor arguments.
max-args = 7

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise be mistaken for first-party code.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
